<g class="koi"><g><ellipse cx="0" cy="196" rx="20" ry="8" fill="#fdfdfd"/><ellipse cx="-6" cy="194" rx="7" ry="5" fill="#e8543f"/><ellipse cx="8" cy="198" rx="5" ry="3.6" fill="#e8543f"/><g class="tail"><path d="M18 196 l16 -8 v16Z" fill="#fff" opacity=".9"/></g><circle cx="-16" cy="194" r="1.6" fill="#222"/></g></g>
<g class="koi2"><g><ellipse cx="0" cy="214" rx="16" ry="6.5" fill="#ffd36b"/><ellipse cx="-4" cy="212" rx="6" ry="4" fill="#f09326"/><g class="tail"><path d="M15 214 l13 -7 v14Z" fill="#ffe7a8" opacity=".9"/></g><circle cx="-12" cy="212" r="1.4" fill="#222"/></g></g>
