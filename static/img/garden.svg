<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
<style>
  .koi{animation:swim 14s ease-in-out infinite}
  .koi2{animation:swim2 18s ease-in-out infinite}
  @keyframes swim{0%{transform:translate(40px,0) rotate(4deg)}50%{transform:translate(280px,16px) rotate(-6deg)}100%{transform:translate(40px,0) rotate(4deg)}}
  @keyframes swim2{0%{transform:translate(300px,24px) scaleX(-1)}50%{transform:translate(90px,4px) scaleX(-1)}100%{transform:translate(300px,24px) scaleX(-1)}}
  .tail{transform-origin:left center;animation:tl 1.2s ease-in-out infinite}
  @keyframes tl{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
  .rings{animation:rg 4s ease-out infinite}
  @keyframes rg{0%{transform:scale(.3);opacity:.8}100%{transform:scale(1.6);opacity:0}}
  .pet3{animation:pf3 10s linear infinite}.q2{animation-delay:3.4s}
  @keyframes pf3{0%{transform:translate(0,-10px) rotate(0)}100%{transform:translate(-50px,270px) rotate(360deg)}}
</style>
<defs>
  <linearGradient id="s6" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe5c6"/><stop offset="1" stop-color="#fdf3dc"/></linearGradient>
  <linearGradient id="pond" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fa3a8"/><stop offset="1" stop-color="#2e6e74"/></linearGradient>
</defs>
