<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
<style>
  .cloud{animation:cl 20s linear infinite}
  .cloud2{animation:cl 32s linear infinite}
  @keyframes cl{from{transform:translateX(-120px)}to{transform:translateX(420px)}}
  .petal{animation:fall 7s linear infinite}
  .p2{animation-delay:1.4s}.p3{animation-delay:3s}.p4{animation-delay:4.6s}.p5{animation-delay:5.8s}
  @keyframes fall{0%{transform:translate(0,-20px) rotate(0)}100%{transform:translate(-50px,280px) rotate(360deg)}}
  .shine{animation:sh 4s ease-in-out infinite}
  @keyframes sh{0%,100%{opacity:.18}50%{opacity:.45}}
</style>
<defs>
  <linearGradient id="s2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9fd8e8"/><stop offset=".6" stop-color="#ffe6ef"/><stop offset="1" stop-color="#fff6e6"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffe27a"/><stop offset=".5" stop-color="#e8b43a"/><stop offset="1" stop-color="#b6831c"/>
  </linearGradient>
</defs>
<rect width="400" height="260" fill="url(#s2)"/>
<circle cx="78" cy="62" r="30" fill="#fff" opacity=".5"/>
<g class="cloud" fill="#ffffff" opacity=".75"><ellipse cx="60" cy="52" rx="34" ry="12"/><ellipse cx="86" cy="46" rx="24" ry="10"/></g>
<g class="cloud2" fill="#ffffff" opacity=".55"><ellipse cx="200" cy="86" rx="40" ry="11"/><ellipse cx="232" cy="80" rx="22" ry="9"/></g>
<path d="M0 196 q70 -34 140 -8 q80 28 160 -12 q50 -24 100 -4 v88 H0Z" fill="#7fa86a"/>
<path d="M0 214 q90 -18 180 2 q90 20 220 -8 v52 H0Z" fill="#5f8a52"/>
<g class="shine"><ellipse cx="188" cy="130" rx="76" ry="62" fill="#ffe27a"/></g>
<g>
  <rect x="186" y="60" width="4" height="22" fill="#8a6a3a"/>
  <circle cx="188" cy="58" r="5" fill="url(#gold)"/>
  <g fill="#c7352f" stroke="#8d2320" stroke-width="1.5">
    <path d="M152 92 h72 l-10 -10 h-52Z"/><path d="M144 116 h88 l-10 -12 h-68Z"/><path d="M134 144 h108 l-12 -14 h-84Z"/><path d="M122 176 h132 l-14 -16 h-104Z"/>
  </g>
  <g fill="#f2e3c9" stroke="#b39c74" stroke-width="1">
    <rect x="170" y="92" width="36" height="14"/><rect x="162" y="116" width="52" height="16"/><rect x="152" y="144" width="72" height="18"/><rect x="146" y="176" width="84" height="26"/>
  </g>
  <rect x="180" y="184" width="16" height="18" fill="#7d4a2a"/>
</g>
<g fill="#9a9a93"><rect x="312" y="196" width="18" height="8"/><rect x="316" y="178" width="10" height="20"/><path d="M306 178 h30 l-6 -10 h-18Z"/><rect x="314" y="160" width="14" height="10" fill="#c9c9bf"/></g>
<g fill="#ffd7e4" class="petal"><ellipse cx="90" cy="20" rx="5" ry="3.4"/></g>
<g fill="#ffc2d6" class="petal p2"><ellipse cx="150" cy="10" rx="4" ry="3"/></g>
<g fill="#ffd7e4" class="petal p3"><ellipse cx="250" cy="14" rx="5" ry="3.4"/></g>
<g fill="#ffb3cc" class="petal p4"><ellipse cx="330" cy="8" rx="4.5" ry="3"/></g>
<g fill="#ffd7e4" class="petal p5"><ellipse cx="40" cy="16" rx="4" ry="3"/></g>
</svg>
