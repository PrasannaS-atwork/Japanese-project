<path d="M240 200 L330 120 q14 -12 28 0 L400 200Z" fill="#2f4c7a" opacity=".9"/>
<g class="c1" fill="#fff" opacity=".6"><ellipse cx="90" cy="140" rx="46" ry="10"/><ellipse cx="124" cy="134" rx="26" ry="8"/></g>
<g class="c2" fill="#fff" opacity=".45"><ellipse cx="230" cy="166" rx="54" ry="9"/></g>
<path d="M0 198 q100 -14 200 0 q100 14 200 0 v62 H0Z" fill="#20304d"/>
