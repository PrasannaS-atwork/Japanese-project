<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
<style>
  .c1{animation:m1 26s linear infinite}.c2{animation:m1 38s linear infinite}
  @keyframes m1{from{transform:translateX(-140px)}to{transform:translateX(440px)}}
  .ray{transform-origin:318px 66px;animation:spin 60s linear infinite;opacity:.35}
  @keyframes spin{to{transform:rotate(360deg)}}
  .bird2{animation:bf 16s linear infinite}
  @keyframes bf{0%{transform:translate(-40px,30px)}100%{transform:translate(440px,-10px)}}
  .wing{animation:wg 1s ease-in-out infinite}
  @keyframes wg{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.35)}}
</style>
<defs>
  <linearGradient id="s4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b3a6b"/><stop offset=".5" stop-color="#e76f8a"/><stop offset="1" stop-color="#ffe0b2"/></linearGradient>
  <linearGradient id="fuji" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6f8fc4"/><stop offset="1" stop-color="#3c5c92"/></linearGradient>
</defs>
<rect width="400" height="260" fill="url(#s4)"/>
