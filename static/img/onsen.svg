<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
<style>
  .steam{animation:st 6s ease-in-out infinite;transform-origin:center bottom}
  .s2{animation-delay:1.2s}.s3{animation-delay:2.4s}.s4{animation-delay:3.6s}.s5{animation-delay:4.8s}
  @keyframes st{0%{transform:translateY(0) scale(.6);opacity:0}25%{opacity:.55}100%{transform:translateY(-90px) scale(1.5);opacity:0}}
  .snow{animation:sn 9s linear infinite}
  .n2{animation-delay:2s}.n3{animation-delay:4s}.n4{animation-delay:6s}.n5{animation-delay:7.5s}
  @keyframes sn{0%{transform:translate(0,-12px)}100%{transform:translate(-26px,272px)}}
  .bob{animation:bb 4s ease-in-out infinite}
  @keyframes bb{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .wv{animation:wvm 6s ease-in-out infinite}
  @keyframes wvm{0%,100%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
</style>
<defs>
  <linearGradient id="s7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a3a5e"/><stop offset="1" stop-color="#8aa0c4"/></linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fe0e8"/><stop offset="1" stop-color="#4fa8b8"/></linearGradient>
</defs>
<rect width="400" height="260" fill="url(#s7)"/>
<circle cx="70" cy="50" r="22" fill="#fdf8e3" opacity=".9"/>
<path d="M0 120 L90 60 L160 120 L240 54 L330 120 L400 80 V160 H0Z" fill="#46587e"/>
<path d="M0 118 L90 60 L120 92 L96 96 L140 128 H0Z" fill="#f2f6ff" opacity=".85"/>
<path d="M200 118 L240 54 L290 104 L262 100 L300 136 H190Z" fill="#f2f6ff" opacity=".8"/>
<path d="M0 150 q80 -22 170 -4 q90 18 230 -8 v122 H0Z" fill="#3a4a6b"/>
<g fill="#eef3fb" opacity=".9"><path d="M0 158 q80 -18 170 -2 q90 16 230 -6 v16 q-130 20 -230 4 q-96 -16 -170 2Z"/></g>
<g fill="#5d4a3a"><rect x="40" y="186" width="320" height="12" rx="6"/></g>
<path d="M48 198 h304 v46 a14 14 0 0 1 -14 14 H62 a14 14 0 0 1 -14 -14Z" fill="#6d5542"/>
<path d="M58 200 h284 v40 a10 10 0 0 1 -10 10 H68 a10 10 0 0 1 -10 -10Z" fill="url(#water)"/>
<g class="wv" stroke="#ffffff" stroke-width="2" fill="none" opacity=".6"><path d="M70 216 q18 -6 36 0 t36 0 t36 0 t36 0 t36 0 t36 0"/><path d="M70 232 q18 -6 36 0 t36 0 t36 0 t36 0 t36 0 t36 0"/></g>
<g fill="#ffffff"><circle class="steam" cx="110" cy="200" r="14"/><circle class="steam s2" cx="160" cy="200" r="11"/><circle class="steam s3" cx="208" cy="200" r="16"/><circle class="steam s4" cx="258" cy="200" r="12"/><circle class="steam s5" cx="306" cy="200" r="13"/></g>
<g class="bob"><g><rect x="150" y="186" width="34" height="10" rx="4" fill="#fdfdfd"/><rect x="152" y="188" width="30" height="3" fill="#d7263d" opacity=".8"/></g></g>
<g class="bob" style="animation-delay:-2s"><circle cx="300" cy="212" r="9" fill="#f6efe0"/><rect x="292" y="206" width="16" height="4" rx="2" fill="#d7263d" opacity=".6"/></g>
<g fill="#8c8c84"><ellipse cx="80" cy="252" rx="26" ry="8"/><ellipse cx="330" cy="254" rx="30" ry="9"/></g>
<g fill="#ffffff"><circle class="snow" cx="40" cy="0" r="3"/><circle class="snow n2" cx="120" cy="0" r="2.4"/><circle class="snow n3" cx="210" cy="0" r="3.2"/><circle class="snow n4" cx="290" cy="0" r="2.6"/><circle class="snow n5" cx="360" cy="0" r="3"/></g>
</svg>
