<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
<style>
  .sun{animation:glow 6s ease-in-out infinite}
  @keyframes glow{0%,100%{opacity:.85}50%{opacity:1}}
  .w1{animation:drift 7s linear infinite}
  .w2{animation:drift 11s linear infinite reverse}
  .w3{animation:drift 9s linear infinite}
  @keyframes drift{from{transform:translateX(-40px)}to{transform:translateX(0)}}
  .bird{animation:fly 14s linear infinite}
  @keyframes fly{0%{transform:translate(-30px,10px)}100%{transform:translate(430px,-30px)}}
  .flap{animation:flap 1.1s ease-in-out infinite}
  @keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.4)}}
</style>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2b1b4a"/><stop offset=".45" stop-color="#b8456b"/>
    <stop offset=".75" stop-color="#f08a5d"/><stop offset="1" stop-color="#ffd3a3"/>
  </linearGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1d4e6f"/><stop offset="1" stop-color="#0d2b43"/>
  </linearGradient>
</defs>
<rect width="400" height="260" fill="url(#sky)"/>
<circle class="sun" cx="300" cy="95" r="38" fill="#fff0c9" opacity=".9"/>
<circle class="sun" cx="300" cy="95" r="58" fill="#ffd27f" opacity=".25"/>
<path d="M0 150 L60 128 L110 150 L170 120 L240 150 L310 132 L400 152 L400 175 L0 175Z" fill="#3b2a52" opacity=".75"/>
<rect y="168" width="400" height="92" fill="url(#sea)"/>
<g class="bird"><g class="flap"><path d="M0 0 q7 -6 14 0 q-7 -3 -14 0" fill="#1b1b2a"/></g></g>
<g fill="#d7263d">
  <rect x="104" y="112" width="13" height="108" rx="3"/>
  <rect x="268" y="112" width="13" height="108" rx="3"/>
  <rect x="82" y="100" width="222" height="12" rx="6" fill="#b01c31"/>
  <rect x="88" y="113" width="210" height="9" rx="4"/>
  <rect x="112" y="140" width="162" height="10" rx="4"/>
  <rect x="186" y="100" width="14" height="42" fill="#b01c31"/>
</g>
<g opacity=".35" fill="#d7263d">
  <rect x="104" y="220" width="13" height="26"/><rect x="268" y="220" width="13" height="26"/>
</g>
<g stroke="#bfe3f2" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".75">
  <path class="w1" d="M-40 196 q20 -7 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0"/>
  <path class="w2" d="M-40 214 q20 -7 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0"/>
  <path class="w3" d="M-40 234 q20 -7 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0"/>
</g>
</svg>
