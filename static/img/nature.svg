<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
<style>
  .b{transform-origin:bottom center;animation:sway 5.5s ease-in-out infinite}
  .b2{animation-duration:7s;animation-delay:-1s}.b3{animation-duration:6.2s;animation-delay:-2s}
  .b4{animation-duration:8s;animation-delay:-3s}.b5{animation-duration:5s;animation-delay:-1.6s}
  @keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.8deg)}}
  .leaf{animation:lf 8s linear infinite}.l2{animation-delay:3s}.l3{animation-delay:5.5s}
  @keyframes lf{0%{transform:translate(0,-10px) rotate(0)}100%{transform:translate(-60px,270px) rotate(380deg)}}
  .beam{animation:bm 7s ease-in-out infinite}
  @keyframes bm{0%,100%{opacity:.1}50%{opacity:.26}}
</style>
<defs><linearGradient id="s5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d8efc8"/><stop offset="1" stop-color="#8ec07c"/></linearGradient></defs>
<rect width="400" height="260" fill="url(#s5)"/>
