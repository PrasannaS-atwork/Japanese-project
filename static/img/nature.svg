  <g class="b3"><rect x="150" y="34" width="12" height="226" rx="6" fill="#548543"/><g fill="#426a35"><rect x="150" y="86" width="12" height="4"/><rect x="150" y="146" width="12" height="4"/></g></g>
  <g class="b4"><rect x="226" y="10" width="18" height="250" rx="8" fill="#7fb063"/><g fill="#638c4d"><rect x="226" y="64" width="18" height="5"/><rect x="226" y="128" width="18" height="5"/><rect x="226" y="194" width="18" height="5"/></g></g>
  <g class="b5"><rect x="300" y="30" width="14" height="230" rx="7" fill="#5e8f4a"/><g fill="#4f7a3e"><rect x="300" y="96" width="14" height="4"/><rect x="300" y="160" width="14" height="4"/></g></g>
  <g class="b2"><rect x="356" y="48" width="12" height="212" rx="6" fill="#6e9e57"/></g>
</g>
