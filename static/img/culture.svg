<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
<style>
  .lan{transform-origin:top center;animation:sw 4.2s ease-in-out infinite}
  .l2b{animation-duration:5s;animation-delay:-1s}.l3b{animation-duration:3.6s;animation-delay:-2s}
  .l4b{animation-duration:4.8s;animation-delay:-2.6s}.l5b{animation-duration:4s;animation-delay:-3.2s}
  @keyframes sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
  .flick{animation:fk 2.6s ease-in-out infinite}
  @keyframes fk{0%,100%{opacity:.5}50%{opacity:.95}}
  .fan{transform-origin:60px 206px;animation:fo 7s ease-in-out infinite}
  @keyframes fo{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(10deg)}}
  .spark{animation:sp 4s ease-out infinite}
  .k2{animation-delay:1.3s}.k3{animation-delay:2.6s}
  @keyframes sp{0%{transform:translateY(0) scale(1);opacity:.9}100%{transform:translateY(-40px) scale(.2);opacity:0}}
</style>
